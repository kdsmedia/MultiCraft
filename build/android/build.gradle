buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.7 supports compileSdk 35 (Android 15) and requires Gradle 8.9+
        // and JDK 17+. This enables targetSdkVersion 35 so the app targets
        // Android 8 (API 26) through Android 16 (API 36).
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Force a single Kotlin stdlib version. The Play services libraries pull
    // kotlin-stdlib-jdk7/jdk8 1.6.21, which clashes with kotlin-stdlib 1.8.22
    // (duplicate classes). Forcing everything to 1.8.22 resolves the dex
    // duplicate-class error.
    configurations.all {
        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

apply plugin: 'com.android.application'

android {
    namespace "com.altomedia.multicraft"
    compileSdk 35

    defaultConfig {
        applicationId "com.altomedia.multicraft"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.1.11.2"
        // Play services adds enough methods to exceed the 65k DEX limit.
        // minSdk 21 uses native multidex (no extra dependency needed).
        multiDexEnabled true
    }

    // Compile Java against JDK 17 language level (JDK 21 runs the build).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
	Properties props = new Properties()
	props.load(new FileInputStream(file("local.properties")))

	if (props.getProperty("keystore") != null) {
		signingConfigs {
			release {
				storeFile file(props["keystore"])
				storePassword props["keystore.password"]
				keyAlias props["key"]
				keyPassword props["key.password"]
			}
		}

		buildTypes {
			release {
				signingConfig signingConfigs.release
			}
		}
	}
// for multiple APKs
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "x86"
        }
    }
}

// build multiple APKs for all ABI
ext.abiCodes = ['armeabi-v7a': 1, x86: 2]
import com.android.build.OutputFile

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def baseAbiVersionCode =
                project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (baseAbiVersionCode != null) {
            output.versionCodeOverride =
                    baseAbiVersionCode + variant.versionCode
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // AndroidX replacements for the legacy com.android.support libraries.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // Google Play Games services + sign-in. 23.2.0 is built against AndroidX
    // and is compatible with compileSdk 35 / AGP 8.7.
    implementation 'com.google.android.gms:play-services-games:23.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'
}

// Apply the google-services plugin LAST so it can read
// build/android/google-services.json and inject the Firebase / Play app id
// (used by Play Games services for the app_id in res/values/games-ids.xml).
apply plugin: 'com.google.gms.google-services'

