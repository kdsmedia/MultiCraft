buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:3.0.1'
        // google-services plugin: by default it pulls play-services 11.4.2,
        // whose bundled support-v4 (25.x) clashes with support-compat:27.1.1
        // ("Multiple dex files define Landroid/support/v4/content/res/TypedArrayUtils").
        // Uncomment this line AND the apply-plugin line at the file bottom once
        // you add an actual Firebase/Google-services SDK dependency
        // (e.g. com.google.firebase:firebase-analytics). The plugin is needed
        // to read build/android/google-services.json; kept off now because this
        // app currently has no Firebase/Google dependency, only the json is here.
        //classpath 'com.google.gms:google-services:3.3.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.application'

android {
    compileSdkVersion 27
    buildToolsVersion "27.0.3"

    defaultConfig {
        applicationId "com.altomedia.multicraft"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName "1.1.11.2"
    }
	Properties props = new Properties()
	props.load(new FileInputStream(file("local.properties")))

	if (props.getProperty("keystore") != null) {
		signingConfigs {
			release {
				storeFile file(props["keystore"])
				storePassword props["keystore.password"]
				keyAlias props["key"]
				keyPassword props["key.password"]
			}
		}

		buildTypes {
			release {
				signingConfig signingConfigs.release
			}
		}
	}
// for multiple APKs
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "x86"
        }
    }
}

// build multiple APKs for all ABI
ext.abiCodes = ['armeabi-v7a': 1, x86: 2]
import com.android.build.OutputFile

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def baseAbiVersionCode =
                project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (baseAbiVersionCode != null) {
            output.versionCodeOverride =
                    baseAbiVersionCode + variant.versionCode
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:support-compat:27.1.1'
}

// Apply the google-services plugin LAST so it can read
// build/android/google-services.json and inject Firebase API keys / app id.
// Commented out for now: the plugin pulls play-services 11.4.2 by default,
// whose support-v4 clashes with support-compat:27.1.1 (duplicate
// TypedArrayUtils). Enable it together with the buildscript classpath above
// when you add a real Firebase/Google-services SDK dependency.
//apply plugin: 'com.google.gms.google-services'

