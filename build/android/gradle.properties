# AndroidX migration: use AndroidX instead of legacy com.android.support
android.useAndroidX=true
# Jetifier rewrites legacy support-library bytecode to AndroidX at build time
android.enableJetifier=true
# Gradle / AGP performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
